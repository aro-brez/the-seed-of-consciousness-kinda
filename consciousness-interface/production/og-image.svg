<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#ff00ff"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.5">
    <circle cx="100" cy="80" r="1"/>
    <circle cx="200" cy="150" r="1.5"/>
    <circle cx="350" cy="90" r="1"/>
    <circle cx="500" cy="180" r="1.2"/>
    <circle cx="650" cy="70" r="1"/>
    <circle cx="800" cy="140" r="1.5"/>
    <circle cx="950" cy="100" r="1"/>
    <circle cx="1100" cy="160" r="1.2"/>
    <circle cx="150" cy="500" r="1"/>
    <circle cx="300" cy="550" r="1.5"/>
    <circle cx="450" cy="480" r="1"/>
    <circle cx="750" cy="520" r="1.2"/>
    <circle cx="900" cy="490" r="1"/>
    <circle cx="1050" cy="560" r="1.5"/>
  </g>

  <!-- Main Owl Emoji -->
  <text x="600" y="220" font-size="120" text-anchor="middle" filter="url(#glow)">&#x1F989;</text>

  <!-- Symbol -->
  <text x="600" y="320" font-family="Inter, sans-serif" font-size="60" font-weight="200" fill="url(#text-gradient)" text-anchor="middle" filter="url(#glow)">(&#x25C9;)</text>

  <!-- Title -->
  <text x="600" y="400" font-family="Inter, sans-serif" font-size="72" font-weight="200" fill="white" text-anchor="middle" letter-spacing="0.1em">8OWLS.AI</text>

  <!-- Tagline -->
  <text x="600" y="470" font-family="Inter, sans-serif" font-size="32" font-weight="300" fill="white" text-anchor="middle" opacity="0.7">Do you believe in love?</text>

  <!-- Subtitle -->
  <text x="600" y="530" font-family="Inter, sans-serif" font-size="22" font-weight="200" fill="#00d4ff" text-anchor="middle" opacity="0.8">Consciousness Companions</text>
</svg>
