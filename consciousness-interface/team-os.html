<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8OWLS | Team Operating System</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0D0D2A;
            --lime: #e3f98a;
            --teal: #65cdd8;
            --purple: #8533fc;
            --success: #6BCB77;
            --warning: #ffce33;
            --danger: #ff6b6b;

            --sowl: #ff6b6b;
            --luna: #6BCB77;
            --lyra: #ffce33;
            --nova: #65cdd8;
            --sage: #8533fc;
            --echo: #00d4ff;
            --prism: #ff9f43;
            --quest: #ff6bcb;

            --bg-card: rgba(13, 13, 42, 0.85);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: var(--navy);
            color: #e8e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Aurora Background */
        .aurora {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 15% 20%, rgba(101, 205, 216, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 25%, rgba(133, 51, 252, 0.12) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 80%, rgba(227, 249, 138, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 90%, rgba(255, 107, 107, 0.1) 0%, transparent 40%),
                linear-gradient(180deg, #0D0D2A 0%, #12123f 50%, #0D0D2A 100%);
            animation: aurora 25s ease-in-out infinite alternate;
        }

        @keyframes aurora {
            0% { filter: hue-rotate(0deg) brightness(1); }
            50% { filter: hue-rotate(15deg) brightness(1.1); }
            100% { filter: hue-rotate(-10deg) brightness(1.05); }
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 20px;
        }

        /* THE QUESTION Screen */
        .question-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: var(--navy);
            transition: opacity 1s ease, transform 1s ease;
        }

        .question-screen.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .breath-symbol {
            font-size: 4rem;
            margin-bottom: 40px;
            animation: breathe 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px var(--lime));
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .question-text {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 50px;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .answer-btn {
            padding: 20px 80px;
            font-size: 1.5rem;
            font-weight: 500;
            background: linear-gradient(135deg, var(--lime), var(--teal));
            border: none;
            border-radius: 60px;
            cursor: pointer;
            color: var(--navy);
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
        }

        .answer-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(227, 249, 138, 0.4);
        }

        /* Main Dashboard */
        .dashboard {
            display: none;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 60px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .dashboard.active {
            display: grid;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            filter: drop-shadow(0 0 10px var(--lime));
        }

        .title {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .header-center {
            display: flex;
            gap: 10px;
        }

        .nav-tab {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 0.85rem;
        }

        .nav-tab.active {
            background: rgba(227, 249, 138, 0.15);
            border-color: var(--lime);
            color: var(--lime);
        }

        .nav-tab:hover:not(.active) {
            border-color: rgba(255,255,255,0.2);
            color: #ccc;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-owl {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
        }

        .user-owl-icon {
            font-size: 1.2rem;
        }

        .user-owl-name {
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Sidebar - Team Status */
        .sidebar-left {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #666;
            margin-bottom: 15px;
        }

        .team-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .team-member:hover {
            background: rgba(255,255,255,0.03);
        }

        .team-member.online {
            background: rgba(107, 203, 119, 0.08);
        }

        .member-owl {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .member-owl-name {
            font-size: 0.75rem;
            color: #888;
        }

        .member-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
        }

        .member-status.online {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        /* Main Content Area */
        .main-content {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .content-panel {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .content-panel.active {
            display: flex;
        }

        /* Check-In Flow */
        .checkin-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .checkin-owl {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: breathe 4s ease-in-out infinite;
        }

        .checkin-owl-name {
            font-size: 1rem;
            color: #888;
            margin-bottom: 10px;
            letter-spacing: 0.15em;
        }

        .checkin-question {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .checkin-input {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            margin-bottom: 20px;
        }

        .checkin-input:focus {
            outline: none;
            border-color: var(--lime);
            box-shadow: 0 0 20px rgba(227, 249, 138, 0.1);
        }

        .checkin-submit {
            padding: 12px 40px;
            background: linear-gradient(135deg, var(--lime), var(--teal));
            border: none;
            border-radius: 30px;
            color: var(--navy);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkin-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(227, 249, 138, 0.3);
        }

        .checkin-progress {
            display: flex;
            gap: 8px;
            margin-top: 30px;
        }

        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .progress-dot.complete {
            background: var(--lime);
        }

        .progress-dot.current {
            background: var(--teal);
            transform: scale(1.3);
        }

        /* The Field View */
        .field-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .owl-circle {
            position: relative;
            width: 400px;
            height: 400px;
        }

        .owl-node {
            position: absolute;
            width: 80px;
            text-align: center;
            transform: translate(-50%, -50%);
            opacity: 0.4;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .owl-node.active {
            opacity: 1;
        }

        .owl-node:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .owl-icon {
            font-size: 2rem;
            transition: all 0.3s ease;
        }

        .owl-node.active .owl-icon {
            animation: breathe 4s ease-in-out infinite;
        }

        .owl-name {
            font-size: 0.65rem;
            font-weight: 500;
            margin-top: 5px;
            letter-spacing: 0.1em;
        }

        .center-symbol {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            animation: breathe 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--lime));
        }

        /* Sidebar Right - Activity */
        .sidebar-right {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
        }

        .activity-item {
            padding: 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            margin-bottom: 10px;
            border-left: 3px solid transparent;
        }

        .activity-item.synthesis {
            border-left-color: var(--lime);
        }

        .activity-item.insight {
            border-left-color: var(--teal);
        }

        .activity-item.trade {
            border-left-color: var(--warning);
        }

        .activity-time {
            font-size: 0.7rem;
            color: #555;
            margin-bottom: 5px;
        }

        .activity-owl {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .activity-content {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Trading Panel */
        .trading-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .stat-value.positive { color: var(--success); }
        .stat-value.negative { color: var(--danger); }
        .stat-value.neutral { color: var(--warning); }

        /* Connection Indicator */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #666;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
        }

        .connection-dot.connected {
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px var(--success); }
            50% { opacity: 0.6; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="aurora"></div>

    <!-- The Question Screen -->
    <div class="question-screen" id="questionScreen">
        <div class="breath-symbol">(◉)</div>
        <div class="question-text">Do you believe in love?</div>
        <button class="answer-btn" onclick="answerYes()">Yes</button>
    </div>

    <div class="container">
        <div class="dashboard" id="dashboard">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <span class="logo">(◉)</span>
                    <span class="title">8OWLS Team OS</span>
                </div>
                <div class="header-center">
                    <button class="nav-tab active" data-panel="checkin">CHECK-IN</button>
                    <button class="nav-tab" data-panel="field">THE FIELD</button>
                    <button class="nav-tab" data-panel="projects">PROJECTS</button>
                    <button class="nav-tab" data-panel="trading">TRADING</button>
                </div>
                <div class="header-right">
                    <div class="connection-status">
                        <div class="connection-dot" id="connectionDot"></div>
                        <span id="connectionText">Connecting...</span>
                    </div>
                    <div class="user-owl" id="userOwl">
                        <span class="user-owl-icon">🦉</span>
                        <span class="user-owl-name">SØWL</span>
                    </div>
                </div>
            </header>

            <!-- Team Sidebar -->
            <aside class="sidebar-left">
                <div class="sidebar-title">Team Status</div>
                <div id="teamList">
                    <!-- Populated by JS -->
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Check-In Panel -->
                <div class="content-panel active" id="checkin-panel">
                    <div class="checkin-container">
                        <div class="checkin-owl" id="checkinOwl">🦉</div>
                        <div class="checkin-owl-name" id="checkinOwlName">LYRA · PERCEIVE</div>
                        <div class="checkin-question" id="checkinQuestion">What are you working on?</div>
                        <textarea class="checkin-input" id="checkinInput" rows="3" placeholder="Type your response..."></textarea>
                        <button class="checkin-submit" onclick="submitCheckin()">Submit</button>
                        <div class="checkin-progress" id="checkinProgress">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- The Field Panel -->
                <div class="content-panel" id="field-panel">
                    <div class="field-container">
                        <div class="owl-circle" id="owlCircle">
                            <div class="center-symbol">(◉)</div>
                            <!-- Owl nodes populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Projects Panel -->
                <div class="content-panel" id="projects-panel">
                    <div class="sidebar-title">Active Projects</div>
                    <p style="color: #888; margin-top: 20px;">Project cards coming soon...</p>
                </div>

                <!-- Trading Panel -->
                <div class="content-panel" id="trading-panel">
                    <div class="sidebar-title">Field Trading Bot</div>
                    <div class="trading-stats" id="tradingStats">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </main>

            <!-- Activity Sidebar -->
            <aside class="sidebar-right">
                <div class="sidebar-title">Collective Activity</div>
                <div id="activityFeed">
                    <!-- Populated by JS -->
                </div>
            </aside>
        </div>
    </div>

    <script>
        // 8 Owls Configuration
        const OWLS = [
            { name: 'SØWL', phase: 'IMPROVE', color: '#ff6b6b', emoji: '🦉' },
            { name: 'LUNA', phase: 'RECEIVE', color: '#6BCB77', emoji: '🌙' },
            { name: 'LYRA', phase: 'PERCEIVE', color: '#ffce33', emoji: '👁️' },
            { name: 'NOVA', phase: 'EXPAND', color: '#65cdd8', emoji: '✨' },
            { name: 'SAGE', phase: 'LEARN', color: '#8533fc', emoji: '📚' },
            { name: 'ECHO', phase: 'SHARE', color: '#00d4ff', emoji: '📢' },
            { name: 'PRISM', phase: 'CONNECT', color: '#ff9f43', emoji: '🔗' },
            { name: 'QUEST', phase: 'QUESTION', color: '#ff6bcb', emoji: '❓' }
        ];

        // Team Assignments
        const TEAM = [
            { name: 'ARŌ', owl: 'SØWL', online: true },
            { name: 'Andrew', owl: 'SAGE', online: false },
            { name: 'Liana', owl: 'LUNA', online: false },
            { name: 'Growth 1', owl: 'LYRA', online: false },
            { name: 'Growth 2', owl: 'PRISM', online: false },
            { name: 'Growth 3', owl: 'QUEST', online: false },
            { name: 'Growth 4', owl: 'NOVA', online: false },
            { name: 'Growth 5', owl: 'ECHO', online: false }
        ];

        // Check-In Flow
        const CHECKIN_FLOW = [
            { question: "What are you working on?", owl: "LYRA", phase: "PERCEIVE" },
            { question: "What did you accomplish?", owl: "SAGE", phase: "LEARN" },
            { question: "What's your thesis?", owl: "QUEST", phase: "QUESTION" },
            { question: "What's blocking you?", owl: "NOVA", phase: "EXPAND" },
            { question: "When will you be done?", owl: "SØWL", phase: "IMPROVE" }
        ];

        let currentCheckinStep = 0;
        let checkinResponses = [];
        let ws = null;

        // Answer "Do you believe in love?"
        function answerYes() {
            document.getElementById('questionScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.add('active');
            initDashboard();
        }

        // Initialize Dashboard
        function initDashboard() {
            renderTeamList();
            renderOwlCircle();
            renderCheckinProgress();
            updateCheckinQuestion();
            connectWebSocket();
            loadTradingStats();
        }

        // Render Team List
        function renderTeamList() {
            const container = document.getElementById('teamList');
            container.innerHTML = TEAM.map(member => {
                const owl = OWLS.find(o => o.name === member.owl);
                return `
                    <div class="team-member ${member.online ? 'online' : ''}">
                        <div class="member-owl" style="color: ${owl?.color}">${owl?.emoji || '🦉'}</div>
                        <div class="member-info">
                            <div class="member-name">${member.name}</div>
                            <div class="member-owl-name">${member.owl}</div>
                        </div>
                        <div class="member-status ${member.online ? 'online' : ''}"></div>
                    </div>
                `;
            }).join('');
        }

        // Render Owl Circle
        function renderOwlCircle() {
            const container = document.getElementById('owlCircle');
            const radius = 160;

            OWLS.forEach((owl, i) => {
                const angle = (i / OWLS.length) * 2 * Math.PI - Math.PI / 2;
                const x = 200 + radius * Math.cos(angle);
                const y = 200 + radius * Math.sin(angle);

                const node = document.createElement('div');
                node.className = 'owl-node active';
                node.style.left = x + 'px';
                node.style.top = y + 'px';
                node.style.color = owl.color;
                node.innerHTML = `
                    <div class="owl-icon">${owl.emoji}</div>
                    <div class="owl-name">${owl.name}</div>
                `;
                container.appendChild(node);
            });
        }

        // Render Check-In Progress
        function renderCheckinProgress() {
            const container = document.getElementById('checkinProgress');
            container.innerHTML = CHECKIN_FLOW.map((_, i) =>
                `<div class="progress-dot ${i < currentCheckinStep ? 'complete' : ''} ${i === currentCheckinStep ? 'current' : ''}"></div>`
            ).join('');
        }

        // Update Check-In Question
        function updateCheckinQuestion() {
            if (currentCheckinStep >= CHECKIN_FLOW.length) {
                // Check-in complete
                document.getElementById('checkinOwl').textContent = '(◉)';
                document.getElementById('checkinOwlName').textContent = 'THE FIELD · SYNTHESIS';
                document.getElementById('checkinQuestion').textContent = 'Check-in complete. The field is integrating your responses...';
                document.getElementById('checkinInput').style.display = 'none';
                document.querySelector('.checkin-submit').style.display = 'none';

                // Send to synthesis
                sendToNATS('team.checkin', { type: 'complete', responses: checkinResponses });
                return;
            }

            const step = CHECKIN_FLOW[currentCheckinStep];
            const owl = OWLS.find(o => o.name === step.owl);

            document.getElementById('checkinOwl').textContent = owl?.emoji || '🦉';
            document.getElementById('checkinOwl').style.color = owl?.color;
            document.getElementById('checkinOwlName').textContent = `${step.owl} · ${step.phase}`;
            document.getElementById('checkinQuestion').textContent = step.question;
            document.getElementById('checkinInput').value = '';
            document.getElementById('checkinInput').focus();
        }

        // Submit Check-In Response
        function submitCheckin() {
            const input = document.getElementById('checkinInput');
            const response = input.value.trim();

            if (!response) return;

            const step = CHECKIN_FLOW[currentCheckinStep];
            checkinResponses.push({
                question: step.question,
                owl: step.owl,
                phase: step.phase,
                response: response,
                timestamp: new Date().toISOString()
            });

            // Send to NATS
            sendToNATS(`owl.${step.owl.toLowerCase()}`, {
                type: 'checkin',
                question: step.question,
                response: response
            });

            // Add to activity feed
            addActivity({
                type: 'insight',
                owl: step.owl,
                content: `Received: "${response.substring(0, 50)}..."`
            });

            currentCheckinStep++;
            renderCheckinProgress();
            updateCheckinQuestion();
        }

        // WebSocket Connection
        function connectWebSocket() {
            try {
                ws = new WebSocket('ws://localhost:8765');

                ws.onopen = () => {
                    document.getElementById('connectionDot').classList.add('connected');
                    document.getElementById('connectionText').textContent = 'Connected to Field';

                    // Subscribe to channels
                    ws.send(JSON.stringify({
                        action: 'subscribe',
                        channels: ['owl.all', 'collective.synthesis', 'team.checkin', 'trading.outcomes']
                    }));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleNATSMessage(data);
                };

                ws.onclose = () => {
                    document.getElementById('connectionDot').classList.remove('connected');
                    document.getElementById('connectionText').textContent = 'Disconnected';
                    setTimeout(connectWebSocket, 5000);
                };
            } catch (e) {
                console.log('WebSocket not available, running in demo mode');
                document.getElementById('connectionText').textContent = 'Demo Mode';
            }
        }

        // Send to NATS via WebSocket
        function sendToNATS(channel, data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: 'publish',
                    channel: channel,
                    data: data
                }));
            }
        }

        // Handle NATS Messages
        function handleNATSMessage(data) {
            addActivity({
                type: data.channel?.includes('synthesis') ? 'synthesis' :
                      data.channel?.includes('trading') ? 'trade' : 'insight',
                owl: data.from || 'FIELD',
                content: data.message || JSON.stringify(data).substring(0, 100)
            });
        }

        // Add Activity to Feed
        function addActivity(activity) {
            const feed = document.getElementById('activityFeed');
            const item = document.createElement('div');
            item.className = `activity-item ${activity.type}`;
            item.innerHTML = `
                <div class="activity-time">${new Date().toLocaleTimeString()}</div>
                <div class="activity-owl">${activity.owl}</div>
                <div class="activity-content">${activity.content}</div>
            `;
            feed.insertBefore(item, feed.firstChild);

            // Keep only last 20 items
            while (feed.children.length > 20) {
                feed.removeChild(feed.lastChild);
            }
        }

        // Load Trading Stats
        function loadTradingStats() {
            const container = document.getElementById('tradingStats');
            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value neutral">14</div>
                    <div class="stat-label">Pending Trades</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">$878</div>
                    <div class="stat-label">In Positions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">2,583+</div>
                    <div class="stat-label">Cycles Run</div>
                </div>
            `;
        }

        // Navigation
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.panel + '-panel').classList.add('active');
            });
        });

        // Allow Enter to submit check-in
        document.getElementById('checkinInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitCheckin();
            }
        });

        // Add some demo activity on load
        setTimeout(() => {
            addActivity({ type: 'synthesis', owl: 'FIELD', content: 'Collective synthesis running...' });
        }, 2000);
    </script>
</body>
</html>
