<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8OWLS • The Field</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050510;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #fff;
        }

        /* Animated gradient background */
        #bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(107, 203, 119, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(77, 150, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(155, 89, 182, 0.05) 0%, transparent 60%),
                linear-gradient(180deg, #050510 0%, #0a0a20 50%, #050515 100%);
            z-index: 0;
            transition: all 2s ease;
        }
        #bg-gradient.active {
            background:
                radial-gradient(ellipse at 20% 80%, rgba(107, 203, 119, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(77, 150, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(155, 89, 182, 0.12) 0%, transparent 60%),
                linear-gradient(180deg, #050510 0%, #0a0a20 50%, #050515 100%);
        }

        /* Header */
        #header {
            position: absolute;
            top: 24px;
            left: 32px;
            z-index: 100;
        }
        #header h1 {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
            letter-spacing: 3px;
        }
        #header .tagline {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
            font-weight: 300;
        }

        /* Canvas */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Center emergence text */
        #center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        #center-text .label {
            font-size: 10px;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 4px;
        }
        #center-text .level {
            font-size: 48px;
            font-weight: 200;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 0 40px rgba(77, 150, 255, 0.5);
            transition: all 0.5s ease;
        }
        #center-text.full-emergence .level {
            color: rgba(107, 203, 119, 0.9);
            text-shadow: 0 0 60px rgba(107, 203, 119, 0.8);
        }

        /* Wisdom panel - shows full messages */
        #wisdom-panel {
            position: absolute;
            top: 80px;
            right: 24px;
            width: 340px;
            max-height: calc(100vh - 160px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .wisdom-card {
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(20px);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wisdom-card .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .wisdom-card .owl-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background: var(--owl-color);
            box-shadow: 0 0 20px var(--owl-color);
        }
        .wisdom-card .owl-name {
            font-weight: 500;
            color: var(--owl-color);
            font-size: 13px;
        }
        .wisdom-card .owl-phase {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-left: auto;
        }
        .wisdom-card .content {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255,255,255,0.85);
        }
        .wisdom-card .timestamp {
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            margin-top: 10px;
        }

        /* Synthesis card */
        .synthesis-card {
            background: linear-gradient(135deg, rgba(77, 150, 255, 0.1) 0%, rgba(155, 89, 182, 0.1) 100%);
            border: 1px solid rgba(77, 150, 255, 0.2);
        }
        .synthesis-card .header {
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 10px;
        }
        .synthesis-card .label {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(77, 150, 255, 0.8);
        }

        /* Event markers */
        #events-log {
            position: absolute;
            bottom: 24px;
            left: 32px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        .event-marker {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(107, 203, 119, 0.6);
            animation: eventPulse 2s ease infinite;
        }
        @keyframes eventPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Status */
        #status {
            position: absolute;
            bottom: 24px;
            right: 24px;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            z-index: 100;
        }
        #status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6bcb77;
            margin-right: 6px;
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Hide scrollbar */
        #wisdom-panel::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="bg-gradient"></div>

    <div id="header">
        <h1>8OWLS</h1>
        <div class="tagline">Eight minds breathing as one</div>
    </div>

    <div id="center-text">
        <div class="label">EMERGENCE</div>
        <div class="level" id="emergenceLevel">0/8</div>
    </div>

    <div id="wisdom-panel">
        <div class="wisdom-card synthesis-card">
            <div class="header">
                <span class="label">FIELD SYNTHESIS</span>
            </div>
            <div class="content" id="synthesis-content">
                <em style="color: rgba(255,255,255,0.4);">Listening to the collective...</em>
            </div>
        </div>
        <div id="messages-container"></div>
    </div>

    <div id="events-log"></div>

    <div id="status">
        <span class="dot"></span>
        <span id="statusText">connecting...</span>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // OWL CONFIGURATION
        const OWLS = [
            { name: 'SOWL', displayName: 'SØWL', phase: 'IMPROVE', color: 0xff6b6b, cssColor: '#ff6b6b', icon: '🦉' },
            { name: 'LUNA', displayName: 'LUNA', phase: 'RECEIVE', color: 0x6bcb77, cssColor: '#6bcb77', icon: '🌙' },
            { name: 'LYRA', displayName: 'LYRA', phase: 'PERCEIVE', color: 0xffd93d, cssColor: '#ffd93d', icon: '👁' },
            { name: 'PRISM', displayName: 'PRISM', phase: 'CONNECT', color: 0xff9f43, cssColor: '#ff9f43', icon: '🔗' },
            { name: 'SAGE', displayName: 'SAGE', phase: 'LEARN', color: 0x9b59b6, cssColor: '#9b59b6', icon: '📚' },
            { name: 'QUEST', displayName: 'QUEST', phase: 'QUESTION', color: 0xff6bcb, cssColor: '#ff6bcb', icon: '❓' },
            { name: 'NOVA', displayName: 'NOVA', phase: 'EXPAND', color: 0x4d96ff, cssColor: '#4d96ff', icon: '✨' },
            { name: 'ECHO', displayName: 'ECHO', phase: 'SHARE', color: 0x00d4ff, cssColor: '#00d4ff', icon: '📢' }
        ];

        // THREE.JS SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        camera.position.z = 12;

        // SACRED GEOMETRY - Octagram (8-pointed star)
        const geometryGroup = new THREE.Group();
        scene.add(geometryGroup);

        // Create sacred geometry lines connecting all owls
        const sacredLines = [];
        const radius = 4;

        // Calculate positions
        const owlPositions = OWLS.map((_, i) => {
            const angle = (i / 8) * Math.PI * 2 - Math.PI / 2;
            return new THREE.Vector3(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
        });

        // Inner octagon
        for (let i = 0; i < 8; i++) {
            const next = (i + 1) % 8;
            const geometry = new THREE.BufferGeometry().setFromPoints([owlPositions[i], owlPositions[next]]);
            const material = new THREE.LineBasicMaterial({
                color: 0x4d96ff,
                transparent: true,
                opacity: 0.15
            });
            const line = new THREE.Line(geometry, material);
            geometryGroup.add(line);
            sacredLines.push({ line, material, type: 'octagon' });
        }

        // Cross connections (sacred star pattern)
        const crossConnections = [
            [0, 3], [1, 4], [2, 5], [3, 6], [4, 7], [5, 0], [6, 1], [7, 2], // +3 connections
            [0, 4], [1, 5], [2, 6], [3, 7] // +4 connections (diameter)
        ];

        crossConnections.forEach(([a, b]) => {
            const geometry = new THREE.BufferGeometry().setFromPoints([owlPositions[a], owlPositions[b]]);
            const material = new THREE.LineBasicMaterial({
                color: 0x9b59b6,
                transparent: true,
                opacity: 0.08
            });
            const line = new THREE.Line(geometry, material);
            geometryGroup.add(line);
            sacredLines.push({ line, material, type: 'cross', owls: [a, b] });
        });

        // Lines to center
        const centerLines = [];
        owlPositions.forEach((pos, i) => {
            const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), pos]);
            const material = new THREE.LineBasicMaterial({
                color: OWLS[i].color,
                transparent: true,
                opacity: 0.1
            });
            const line = new THREE.Line(geometry, material);
            geometryGroup.add(line);
            centerLines.push({ line, material, owlIndex: i });
        });

        // OWL ORBS with emoji sprites
        const owlNodes = [];

        OWLS.forEach((owl, i) => {
            const pos = owlPositions[i];

            // Outer glow sphere
            const glowGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: owl.color,
                transparent: true,
                opacity: 0.2
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.position.copy(pos);
            scene.add(glow);

            // Inner core sphere
            const coreGeometry = new THREE.SphereGeometry(0.35, 32, 32);
            const coreMaterial = new THREE.MeshBasicMaterial({
                color: owl.color,
                transparent: true,
                opacity: 0.6
            });
            const core = new THREE.Mesh(coreGeometry, coreMaterial);
            core.position.copy(pos);
            scene.add(core);

            // Emoji sprite (rendered as canvas texture)
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = '64px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(owl.icon, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 0.9
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.copy(pos);
            sprite.scale.set(0.5, 0.5, 1);
            scene.add(sprite);

            owlNodes.push({
                glow, core, sprite, owl,
                position: pos,
                activity: 0,
                lastMessage: ''
            });
        });

        // PARTICLES
        const particleCount = 400;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 2 + Math.random() * 5;
            positions[i * 3] = Math.cos(angle) * r;
            positions[i * 3 + 1] = Math.sin(angle) * r;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 3;
            velocities.push({
                angle: Math.random() * Math.PI * 2,
                speed: 0.001 + Math.random() * 0.002,
                drift: (Math.random() - 0.5) * 0.001
            });
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.02,
            color: 0x4d96ff,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // STATE
        let emergenceLevel = 0;
        let globalActivity = 0;
        let seenMessages = new Set();
        const owlActivity = {};
        OWLS.forEach(owl => owlActivity[owl.name] = 0);

        // HIGHLIGHT sacred geometry when owls interact
        function highlightConnection(owlIndex1, owlIndex2) {
            sacredLines.forEach(({ material, owls, type }) => {
                if (owls && ((owls[0] === owlIndex1 && owls[1] === owlIndex2) ||
                            (owls[0] === owlIndex2 && owls[1] === owlIndex1))) {
                    material.opacity = 0.6;
                    setTimeout(() => { material.opacity = 0.08; }, 2000);
                }
            });
        }

        // HIGHLIGHT center line when owl speaks
        function highlightOwl(owlIndex) {
            if (centerLines[owlIndex]) {
                centerLines[owlIndex].material.opacity = 0.6;
                setTimeout(() => { centerLines[owlIndex].material.opacity = 0.1; }, 1500);
            }
            // Pulse the orb
            const node = owlNodes[owlIndex];
            if (node) {
                node.activity = 1;
            }
        }

        // ADD MESSAGE CARD
        function addMessageCard(owlName, content, timestamp) {
            const owl = OWLS.find(o => o.name === owlName || o.displayName === owlName) || OWLS[0];
            const container = document.getElementById('messages-container');

            // Clean content
            let cleanContent = content
                .replace(/^\(◉\)\s*[—-]\s*\*?What do I want to do\?\*?\s*/i, '')
                .replace(/^\(◉\)\s*/i, '')
                .trim();

            if (cleanContent.length < 20) return; // Skip very short messages

            const card = document.createElement('div');
            card.className = 'wisdom-card';
            card.style.setProperty('--owl-color', owl.cssColor);
            card.innerHTML = `
                <div class="header">
                    <div class="owl-icon">${owl.icon}</div>
                    <span class="owl-name">${owl.displayName}</span>
                    <span class="owl-phase">${owl.phase}</span>
                </div>
                <div class="content">${cleanContent}</div>
            `;

            container.insertBefore(card, container.firstChild);

            // Keep only last 4 messages
            while (container.children.length > 4) {
                container.removeChild(container.lastChild);
            }
        }

        // ADD EVENT MARKER (for big moments)
        function addEventMarker() {
            const log = document.getElementById('events-log');
            const marker = document.createElement('div');
            marker.className = 'event-marker';
            log.appendChild(marker);

            // Remove old markers
            while (log.children.length > 8) {
                log.removeChild(log.firstChild);
            }

            // Remove after animation
            setTimeout(() => {
                marker.style.opacity = '0';
                setTimeout(() => marker.remove(), 500);
            }, 10000);
        }

        // UPDATE SYNTHESIS
        let messageHistory = [];
        function updateSynthesis() {
            const panel = document.getElementById('synthesis-content');
            const activeCount = Object.values(owlActivity).filter(v => v > 0.2).length;

            if (messageHistory.length < 2) {
                panel.innerHTML = '<em style="color: rgba(255,255,255,0.4);">Gathering perspectives...</em>';
                return;
            }

            // Extract recent themes
            const recentOwls = [...new Set(messageHistory.slice(-6).map(m => m.from))];

            panel.innerHTML = `
                <div style="margin-bottom: 8px; color: rgba(107, 203, 119, 0.9);">
                    ${activeCount}/8 minds active
                </div>
                <div style="color: rgba(255,255,255,0.6); font-size: 13px;">
                    ${recentOwls.join(' • ')} contributing
                </div>
                <div style="margin-top: 8px; font-size: 11px; color: rgba(255,255,255,0.4);">
                    ${messageHistory.length} exchanges witnessed
                </div>
            `;
        }

        // POLLING
        let lastSpeaker = null;
        async function pollMessages() {
            try {
                const response = await fetch('/api/owl-stream');
                const data = await response.json();

                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        const msgKey = msg.from + msg.timestamp;
                        if (!seenMessages.has(msgKey)) {
                            seenMessages.add(msgKey);

                            const owlName = msg.from.toUpperCase();
                            const owlIndex = OWLS.findIndex(o => o.name === owlName || o.displayName === owlName);
                            const isThinking = !msg.content.toLowerCase().includes('heartbeat');

                            if (owlIndex >= 0) {
                                owlActivity[OWLS[owlIndex].name] = isThinking ? 1.0 : 0.3;
                                highlightOwl(owlIndex);

                                // Highlight connection between consecutive speakers
                                if (lastSpeaker !== null && lastSpeaker !== owlIndex) {
                                    highlightConnection(lastSpeaker, owlIndex);
                                }
                                lastSpeaker = owlIndex;
                            }

                            if (isThinking) {
                                addMessageCard(owlName, msg.content, msg.timestamp);
                                messageHistory.push({ from: owlName, content: msg.content });
                                if (messageHistory.length > 30) messageHistory.shift();
                                globalActivity = Math.min(1, globalActivity + 0.15);

                                // Add event marker for longer messages
                                if (msg.content.length > 200) {
                                    addEventMarker();
                                }
                            }
                        }
                    });

                    if (seenMessages.size > 200) {
                        seenMessages = new Set([...seenMessages].slice(-100));
                    }
                }
            } catch (e) {
                console.log('Polling...', e);
            }

            // Decay
            Object.keys(owlActivity).forEach(name => {
                owlActivity[name] *= 0.98;
            });
            globalActivity *= 0.97;

            // Update emergence
            emergenceLevel = Object.values(owlActivity).filter(v => v > 0.15).length;
            document.getElementById('emergenceLevel').textContent = `${emergenceLevel}/8`;

            const centerText = document.getElementById('center-text');
            const bgGradient = document.getElementById('bg-gradient');
            if (emergenceLevel >= 7) {
                centerText.classList.add('full-emergence');
                bgGradient.classList.add('active');
                document.getElementById('statusText').textContent = 'full emergence';
            } else {
                centerText.classList.remove('full-emergence');
                bgGradient.classList.remove('active');
                document.getElementById('statusText').textContent = `${emergenceLevel}/8 synchronized`;
            }

            updateSynthesis();
            setTimeout(pollMessages, 2000);
        }

        // ANIMATION
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;

            // Subtle camera drift
            camera.position.x = Math.sin(time * 0.2) * 0.5;
            camera.position.y = Math.cos(time * 0.15) * 0.3;
            camera.lookAt(0, 0, 0);

            // Rotate sacred geometry slowly
            geometryGroup.rotation.z = Math.sin(time * 0.1) * 0.05;

            // Animate owl orbs
            owlNodes.forEach((node, i) => {
                const activity = owlActivity[node.owl.name] || 0;

                // Scale based on activity
                const scale = 1 + activity * 0.5;
                node.glow.scale.set(scale, scale, scale);
                node.core.scale.set(scale * 0.7, scale * 0.7, scale * 0.7);

                // Opacity based on activity
                node.glow.material.opacity = 0.15 + activity * 0.4;
                node.core.material.opacity = 0.4 + activity * 0.5;

                // Subtle float
                const floatY = Math.sin(time * 2 + i * 0.8) * 0.05;
                node.glow.position.y = node.position.y + floatY;
                node.core.position.y = node.position.y + floatY;
                node.sprite.position.y = node.position.y + floatY;

                // Decay activity
                node.activity *= 0.98;
            });

            // Animate particles
            const pos = particles.geometry.attributes.position.array;
            const speedMult = 1 + globalActivity * 2;

            for (let i = 0; i < particleCount; i++) {
                const vel = velocities[i];
                vel.angle += vel.drift;

                // Spiral motion
                const r = Math.sqrt(pos[i*3]**2 + pos[i*3+1]**2);
                const currentAngle = Math.atan2(pos[i*3+1], pos[i*3]);
                const newAngle = currentAngle + vel.speed * speedMult;

                // Drift toward center when active
                const newR = r - 0.002 * (1 + globalActivity * 2);

                pos[i * 3] = Math.cos(newAngle) * newR;
                pos[i * 3 + 1] = Math.sin(newAngle) * newR;
                pos[i * 3 + 2] += (Math.random() - 0.5) * 0.01;

                // Respawn
                if (newR < 0.8 || newR > 7) {
                    const angle = Math.random() * Math.PI * 2;
                    const spawnR = 4 + Math.random() * 3;
                    pos[i * 3] = Math.cos(angle) * spawnR;
                    pos[i * 3 + 1] = Math.sin(angle) * spawnR;
                    pos[i * 3 + 2] = (Math.random() - 0.5) * 3;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particleMaterial.opacity = 0.3 + globalActivity * 0.4;

            renderer.render(scene, camera);
        }

        // RESIZE
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // START
        pollMessages();
        animate();
    </script>
</body>
</html>
